<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f4a">
  <title>라온 테니스 AI 매니저</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
  <header class="topbar">
    <div class="titlewrap">
      <h1>라온 테니스 <span>AI 매니저</span></h1>
      <button class="topicon" data-tab="lineup" aria-label="조편성">🎾 조편성</button>
    </div>
    <span id="modeBadge" class="badge"></span>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" aria-label="예약 추가">＋</button>

  <nav class="bottomnav">
    <button data-tab="calendar" class="active"><span>📅</span>캘린더</button>
    <button data-tab="list"><span>📋</span>예약 목록</button>
    <button data-tab="import"><span>🤖</span>AI 분석</button>
    <button data-tab="settings"><span>⚙️</span>설정</button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet-body"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="config.js?v=15"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="store.js?v=15"></script>
  <script src="kakao.js?v=15"></script>
  <script src="lineup.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
